# Bộ rule máy đọc được — bản đầu (ROLES.md §5). Mỗi rule: một ngưỡng số,
# một checker trong pcbkit/checks.py. Mức: C (dừng), M (cần duyệt), m (ghi nhận).
- id: PLC-011
  severity: C
  title: Tụ decoupling gần chân nguồn được gán
  applies_to: {role: decap}
  metric: pad_to_pin_mm
  threshold: {max: 2.5}
  checker: near_distance
  knowledge: knowledge/02-placement.md#3-decoupling
- id: PLC-034
  severity: C
  title: Linh kiện bảo vệ/lọc sát thân connector
  applies_to: {role: esd}
  # v1 đo tới tâm chân (6 mm) — không đạt được về hình học với connector 2 hàng
  # (chân hàng mép nằm sâu ~6 mm trong courtyard). v2: đo tới mép thân connector.
  metric: pad_to_connector_body_mm
  to: connector_body
  threshold: {max: 3.0}
  checker: near_distance
  knowledge: knowledge/02-placement.md#5-termination--linh-kiện-thụ-động-tín-hiệu
- id: PLC-NEAR
  severity: M
  title: Linh kiện có chỉ định "near" nằm gần đích
  applies_to: {role: other}
  # v1 đo tâm–tâm 6 mm: phạt oan linh kiện pad to (cuộn 6×6 mm). v2: mép pad–mép pad 4 mm.
  metric: pad_edge_to_pin_edge_mm
  edge: true
  threshold: {max: 4.0}
  checker: near_distance
- id: PLC-OVL
  severity: C
  title: Không chồng courtyard
  metric: overlaps
  threshold: {max: 0}
  checker: courtyard_overlap
- id: RT-OPEN
  severity: C
  title: Mọi chân đã nối (theo connectivity của KiCad)
  metric: unconnected
  threshold: {max: 0}
  checker: kicad_unconnected
- id: DRC-ERR
  severity: C
  title: DRC KiCad sạch
  metric: violations
  threshold: {max: 0}
  checker: kicad_drc
  drc_severity: error
- id: DRC-WARN
  severity: m
  title: Cảnh báo DRC KiCad (silkscreen…)
  metric: warnings
  threshold: {max: 0}
  checker: kicad_drc
  drc_severity: warning
- id: PWR-001
  severity: C
  title: Bề rộng đường đủ cho dòng (trừ đoạn cổ chai ≤ 1 mm quanh pad)
  metric: narrow_segments
  threshold: {max: 0}
  checker: track_width
  knowledge: knowledge/03-power-pdn-thermal.md#2-bề-rộng-đường-theo-dòng
- id: SMPS-002
  severity: C
  title: Diện tích hot loop bộ buck
  metric: loop_area_mm2
  threshold: {max: 15}
  checker: hot_loop
  knowledge: knowledge/03-power-pdn-thermal.md#4-nguồn-xung-smps
- id: EMC-001
  severity: C
  title: Plane GND liền một khối (không bị via/antipad cắt rời)
  metric: islands
  # mảnh < 1 mm² là đồng chết kẹt giữa via (xoá ở bản sản xuất), không phải cắt plane
  min_area_mm2: 1.0
  threshold: {max: 1}
  checker: plane_islands
  knowledge: knowledge/05-emc-esd-automotive.md#2-gnd
- id: EMC-021
  severity: M
  title: Via khâu GND dọc mép board (ngoài vùng connector/lỗ vít)
  metric: max_gap_mm
  inset: 1.2
  threshold: {max: 5.0}
  checker: edge_stitch
  knowledge: knowledge/05-emc-esd-automotive.md#4-mép-board--stitching
- id: RT-CLR
  severity: C
  title: Router kết thúc với 0 ô chồng (clearance đúng theo cấu trúc, không nhờ may)
  metric: overused_cells
  threshold: {max: 0}
  checker: router_clearance
- id: PWR-005
  severity: C
  title: Đổi lớp của net dòng lớn có đủ via song song (1 A/via + 1 dự phòng)
  metric: short_vias
  min_current_a: 1.0
  amps_per_via: 1.0
  threshold: {max: 0}
  checker: hc_vias
  knowledge: knowledge/03-power-pdn-thermal.md#via-mang-dòng
- id: DFM-005
  severity: M
  title: Via cách mép pad SMD ≥ 0.25 mm (mask web, không hút thiếc)
  metric: close_vias
  threshold: {max: 0, min: 0.25}
  checker: via_pad_gap
  knowledge: knowledge/09-dfm-dfa-dft.md#1-fab-profile-fab-profilesyaml
- id: SMPS-004
  severity: C
  title: Giữ khoảng cách net nhạy ↔ nút chuyển mạch (keep_away, KiCad DRC phân xử)
  metric: violations
  rule_prefix: keep_
  threshold: {max: 0}
  checker: kicad_rule
  knowledge: knowledge/03-power-pdn-thermal.md#4-nguồn-xung-smps
- id: SI-070
  severity: C
  title: Clock/thạch anh không via (via_count của net class, KiCad DRC phân xử)
  metric: violations
  rule_prefix: via_count_
  threshold: {max: 0}
  checker: kicad_rule
  knowledge: knowledge/04-high-speed-si.md#8-clock
